name: Reduced eight-root benchmark
on:
  push:
    paths:
      - '.github/workflows/ReducedRootBenchmark.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Compile trees and index pinned database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV9.cpp -lgmpxx -lgmp -o Build/ProofTreeV9
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeReduced.cpp -lgmpxx -lgmp -o Build/ProofTreeReduced
          cd Build
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Compare complete and reduced roots with bounded runs
        working-directory: Build
        run: |
          set +e
          run_case() {
            local prog="$1" exponent="$2" cap="$3"
            local log="Reduced${prog}E${exponent}.log"
            echo "=== START program=$prog exponent=$exponent cap=${cap}s ==="
            timeout --signal=TERM --kill-after=5s "${cap}s" "./${prog}" "$exponent" 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            if [[ "$rc" -eq 124 ]]; then
              echo "ROOT_RESULT program=$prog exponent=$exponent status=TIMEOUT"
            elif [[ "$rc" -eq 0 ]]; then
              echo "ROOT_RESULT program=$prog exponent=$exponent status=EXITED"
            else
              echo "ROOT_RESULT program=$prog exponent=$exponent status=ERROR code=$rc"
            fi
          }
          run_case ProofTreeV9 300 30
          run_case ProofTreeReduced 300 30
          run_case ProofTreeV9 500 60
          run_case ProofTreeReduced 500 60
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReducedRootBenchmarkLogs
          path: Build/Reduced*.log
          if-no-files-found: ignore
          retention-days: 30
