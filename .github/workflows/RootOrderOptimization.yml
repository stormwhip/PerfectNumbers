name: Exhaustive root-order subset dynamic programming
on:
  push:
    paths:
      - '.github/workflows/RootOrderOptimization.yml'
permissions:
  contents: read
jobs:
  profile-and-optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Compile index builder and exhaustive profiler
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/RootOrderProfiler.cpp -lgmpxx -lgmp -o Build/RootOrderProfiler
      - name: Download and verify factor database
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ../Build/BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Measure every subset transition and run exact DP
        working-directory: Build
        run: |
          set -o pipefail
          ./RootOrderProfiler 300 | tee RootOrderProfile.csv
          python3 ../Sources/Python/RootOrderOptimizer.py RootOrderProfile.csv | tee RootOrderOptimalOrders.txt
      - name: Archive complete edge costs and optimal orders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RootOrderSubsetDynamicProgramming
          path: |
            Build/RootOrderProfile.csv
            Build/RootOrderOptimalOrders.txt
          if-no-files-found: ignore
          retention-days: 30
