name: Bounded target-2400 residual arithmetic comparison
on:
  push:
    paths:
      - '.github/workflows/Residual2400Benchmark.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r Requirements.txt
          sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Compile both engines and independently run the safety regression
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofCoreTestsV18.cpp -lgmpxx -lgmp -o Build/ProofCoreTestsV18
          ./Build/ProofCoreTestsV18
          for v in 16 18; do
            g++ -std=c++17 -O2 -fopenmp "Sources/Cpp/ProofTreeV${v}.cpp" -lgmpxx -lgmp -o "Build/ProofTreeV${v}"
          done
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
      - name: Generate 9 actual enhanced prefix certificates
        run: |
          set -o pipefail
          python -u Sources/Python/Targeted2400Certificates.py Build/PrefixDualBounds.csv | tee Build/PrefixLp.txt
      - name: Check fixed dataset and build index
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Bounded 20-second tests on each root, old versus safe residual bound
        working-directory: Build
        run: |
          set +e
          errors=0
          for prime in 19 7 11 31 13 3 5 17; do
            for version in V16 V18; do
              echo "=== SAFE2400 version=$version root=$prime cap=20 ==="
              timeout --signal=TERM --kill-after=5s 20s "./ProofTree$version" 2400 "$prime" 2>&1 | tee "P2400_${version}_${prime}.log"
              rc="${PIPESTATUS[0]}"
              if [[ "$rc" == 0 ]] && grep -Eq "^Forbid p=$prime -> PROVEN .*failed_rb=0" "P2400_${version}_${prime}.log"; then
                status=PROVEN
              elif [[ "$rc" == 124 ]]; then
                status=TIMEOUT
              else
                status=UNRESOLVED
                errors=$((errors + 1))
              fi
              echo "SAFE2400_RESULT version=$version root=$prime status=$status rc=$rc"
            done
          done
          if (( errors > 0 )); then echo "::error::$errors unexpected solver errors";exit 1; fi
      - name: Archive complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Residual2400BenchmarkResults
          path: |
            Build/PrefixLp.txt
            Build/PrefixDualBounds.csv
            Build/PrefixDualVariableGains.csv
            Build/PrefixDualForcedGains.csv
            Build/P2400_*.log
          retention-days: 30
          if-no-files-found: ignore
