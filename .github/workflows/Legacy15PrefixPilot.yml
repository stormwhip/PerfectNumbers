name: Fifteen-prime prefix LP probe for 2400
on:
  push:
    paths:
      - '.github/workflows/Legacy15PrefixPilot.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Requirements.txt
      - run: python -m pip install -r Requirements.txt
      - name: Calculate all 16 contiguous prefix LPs
        run: |
          mkdir -p Build
          set -o pipefail
          python -u Sources/Python/Legacy15PrefixProbe.py | tee Build/Legacy15Prefix.txt
      - name: Archive all certified prefix values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Legacy15RootPrefixLowerBounds
          path: Build/Legacy15Prefix.txt
          retention-days: 30
