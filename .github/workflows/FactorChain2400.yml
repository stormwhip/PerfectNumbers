name: PerfectNumbers 2400 — manual factor chain
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Default compiles only; other modes may download a 660MB factor database'
        required: true
        default: 'CompileOnly'
        type: choice
        options:
          - CompileOnly
          - ProbeRoot
          - FullRoot
          - AllRoots
      root:
        description: 'Selected root assumes all earlier roots have already been excluded'
        required: true
        default: '17'
        type: choice
        options:
          - '19'
          - '7'
          - '11'
          - '31'
          - '13'
          - '3'
          - '5'
          - '17'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.mode != 'CompileOnly'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Requirements.txt
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Build source and run independent core tests
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV21.cpp -lgmpxx -lgmp -o Build/ProofTreeV21
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofCoreTestsV21.cpp -lgmpxx -lgmp -o Build/ProofCoreTestsV21
          ./Build/ProofCoreTestsV21
          echo "SOURCE_COMMIT=$GITHUB_SHA"
      - name: Install LP dependencies
        if: inputs.mode != 'CompileOnly'
        run: python -m pip install -r Requirements.txt
      - name: Generate complete 256-prefix enhanced 2400 certificates
        if: inputs.mode != 'CompileOnly'
        run: |
          set -o pipefail
          python -u Sources/Python/PrefixDualCertificates.py Build/PrefixDualBounds.csv | tee Build/PrefixCertificateLog.txt
          test "$(($(wc -l < Build/PrefixDualBounds.csv) - 1))" -eq 256
          test -s Build/PrefixDualVariableGains.csv
          test -s Build/PrefixDualForcedGains.csv
      - name: Download fixed factor database and verify hash
        if: inputs.mode != 'CompileOnly'
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Run selected exponent-2400 proof experiment
        if: inputs.mode != 'CompileOnly'
        working-directory: Build
        env:
          MODE: ${{ inputs.mode }}
          ROOT: ${{ inputs.root }}
        run: |
          set -o pipefail
          echo "TARGET=2400 MODE=$MODE ROOT=$ROOT SOURCE_COMMIT=$GITHUB_SHA" | tee ProofRun.log
          rc=0
          if [[ "$MODE" == "AllRoots" ]]; then
            ./ProofTreeV21 2400 2>&1 | tee -a ProofRun.log || rc=$?
            for p in 19 7 11 31 13 3 5 17; do
              grep -Eq "^Forbid p=$p -> PROVEN .*failed_rb=0" ProofRun.log || {
                echo "UNRESOLVED_ROOT=$p"; rc=1;
              }
            done
          elif [[ "$MODE" == "ProbeRoot" ]]; then
            timeout --signal=TERM --kill-after=5s 120s ./ProofTreeV21 2400 "$ROOT" 2>&1 | tee -a ProofRun.log || rc=$?
            if [[ "$rc" == 124 ]]; then
              echo "PROBE_TIMEOUT=120s; NOT_A_PROOF" | tee -a ProofRun.log
              rc=0
            else
              grep -Eq "^Forbid p=$ROOT -> PROVEN .*failed_rb=0" ProofRun.log || rc=1
            fi
          else
            ./ProofTreeV21 2400 "$ROOT" 2>&1 | tee -a ProofRun.log || rc=$?
            grep -Eq "^Forbid p=$ROOT -> PROVEN .*failed_rb=0" ProofRun.log || rc=1
          fi
          if (( rc != 0 )); then echo "::error::Proof unresolved or engine error"; exit 1; fi
      - name: Preserve logs and interval certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PerfectNumbers2400Evidence
          path: |
            Build/PrefixDualBounds.csv
            Build/PrefixDualVariableGains.csv
            Build/PrefixDualForcedGains.csv
            Build/PrefixCertificateLog.txt
            Build/ProofRun.log
          if-no-files-found: ignore
          retention-days: 30
