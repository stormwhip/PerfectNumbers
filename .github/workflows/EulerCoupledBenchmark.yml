name: Euler-coupled interval LP pilot
on:
  push:
    paths:
      - '.github/workflows/EulerCoupledBenchmark.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Requirements.txt
      - name: Compile V17 and check Euler coupling in isolation
        run: |
          sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
          mkdir -p Build
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofCoreTestsV17.cpp -lgmpxx -lgmp -o Build/ProofCoreTestsV17
          ./Build/ProofCoreTestsV17
          python3 Sources/Python/EulerDualTests.py
      - name: Generate interval-checked target-prefix costs
        run: |
          python -m pip install -r Requirements.txt
          set -o pipefail
          python -u Sources/Python/EulerTargetedCertificates.py Build/PrefixDualBounds.csv | tee Build/EulerCertificateLog.txt
      - name: Build V16 and V17 with identical optimization flags
        run: |
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV16.cpp -lgmpxx -lgmp -o Build/ProofTreeV16
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV17.cpp -lgmpxx -lgmp -o Build/ProofTreeV17
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
      - name: Download fixed checked data and build index
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Compare V16 and V17 on completed and time-capped roots
        working-directory: Build
        run: |
          set +e
          for spec in "1000 31 30" "1500 17 45" "2201 17 30" "2300 17 30"; do
            read -r exponent root cap <<< "$spec"
            for version in ProofTreeV16 ProofTreeV17; do
              echo "=== EULER_BENCH version=$version exponent=$exponent root=$root cap=$cap ==="
              timeout --signal=TERM --kill-after=5s "${cap}s" "./$version" "$exponent" "$root" 2>&1 | tee "${version}_E${exponent}_P${root}.log"
              rc="${PIPESTATUS[0]}"
              if [[ "$rc" == 0 ]] && grep -Eq "^Forbid p=${root} -> PROVEN .*failed_rb=0" "${version}_E${exponent}_P${root}.log"; then
                status=PROVEN
              elif [[ "$rc" == 124 ]]; then
                status=TIMEOUT
              else
                status=UNRESOLVED
              fi
              echo "EULER_BENCH_RESULT version=$version exponent=$exponent root=$root status=$status rc=$rc"
            done
          done
      - name: Archive certificates and complete logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EulerCoupledPilotResults
          path: |
            Build/PrefixDualBounds.csv
            Build/PrefixDualVariableGains.csv
            Build/PrefixDualForcedGains.csv
            Build/PrefixDualEulerCosts.csv
            Build/EulerCertificateLog.txt
            Build/ProofTreeV*.log
          if-no-files-found: ignore
          retention-days: 30
