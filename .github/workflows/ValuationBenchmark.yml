name: Valuation-cut V9 versus V10 benchmark
on:
  push:
    paths:
      - '.github/workflows/ValuationBenchmark.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Build and verify source database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
          for version in V9 V10; do
            g++ -std=c++17 -O2 -fopenmp "Sources/Cpp/ProofTree${version}.cpp" -lgmpxx -lgmp -o "Build/ProofTree${version}"
          done
          cd Build
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Run matched root and exponent cases
        working-directory: Build
        run: |
          set +e
          run_case() {
            local version="$1" exponent="$2" root="$3" cap="$4"
            local log="Valuation${version}E${exponent}P${root}.log"
            echo "=== START version=$version exponent=$exponent root=$root timeout=${cap}s ==="
            timeout --signal=TERM --kill-after=5s "${cap}s" "./ProofTree${version}" "$exponent" "$root" 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            if [[ "$rc" -eq 0 ]] && grep -Eq "^Forbid p=$root -> PROVEN .* failed_rb=0 \\|" "$log"; then
              echo "BENCHMARK_RESULT version=$version exponent=$exponent root=$root status=PROVEN code=$rc"
            elif [[ "$rc" -eq 124 ]]; then
              echo "BENCHMARK_RESULT version=$version exponent=$exponent root=$root status=TIMEOUT code=$rc"
            else
              echo "BENCHMARK_RESULT version=$version exponent=$exponent root=$root status=UNRESOLVED code=$rc"
            fi
          }
          for root in 17 307; do
            for version in V9 V10; do
              run_case "$version" 1000 "$root" 25
            done
          done
          for version in V9 V10; do
            run_case "$version" 1500 307 45
          done
          for version in V9 V10; do
            run_case "$version" 2201 17 30
          done
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ValuationBenchmarkLogs
          path: Build/Valuation*.log
          if-no-files-found: ignore
          retention-days: 30
