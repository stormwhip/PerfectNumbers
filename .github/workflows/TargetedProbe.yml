name: Targeted exponent 2201 probe
on:
  push:
    paths:
      - '.github/workflows/TargetedProbe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GMP and zlib
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Compile V5, V6 and indexer
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV5.cpp -lgmpxx -lgmp -o Build/ProofTreeV5
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV6.cpp -lgmpxx -lgmp -o Build/ProofTreeV6
      - name: Retrieve pinned database and construct index
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Run short baseline and exponent probes
        working-directory: Build
        run: |
          set +e
          run_case() {
            local version="$1" exponent="$2" root="$3" cap="$4"
            local log="Probe${version}E${exponent}P${root}.log"
            echo "=== START version=$version exponent=$exponent root=$root timeout=${cap}s ==="
            timeout --signal=TERM --kill-after=5s "${cap}s" "./ProofTree${version}" "$exponent" "$root" 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            if [[ "$rc" -eq 124 ]]; then
              echo "RESULT version=$version exponent=$exponent root=$root status=TIMEOUT code=$rc"
            elif [[ "$rc" -eq 0 ]] && grep -Eq "^Forbid p=$root -> PROVEN .* failed_rb=0 \\|" "$log"; then
              echo "RESULT version=$version exponent=$exponent root=$root status=TREE_SUCCESS code=$rc"
            else
              echo "RESULT version=$version exponent=$exponent root=$root status=UNRESOLVED code=$rc"
            fi
          }
          run_case V5 1000 17 35
          run_case V6 1000 17 35
          run_case V6 2201 17 120
          run_case V6 2201 307 120
      - name: Save small probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TargetedProbeLogs
          path: Build/Probe*.log
          if-no-files-found: ignore
          retention-days: 30
