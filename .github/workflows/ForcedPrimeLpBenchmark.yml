name: Intermediate-state LP and forced-prime benchmark
on:
  push:
    paths:
      - '.github/workflows/ForcedPrimeLpBenchmark.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r Requirements.txt
          sudo apt-get update
          sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Generate two real dual certificates and 254 trivial safe placeholders
        run: |
          mkdir -p Build
          set -o pipefail
          python -u Sources/Python/TargetedPrefixCertificates.py Build/PrefixDualBounds.csv | tee Build/TargetedCertificateLog.txt
      - name: Build matching source versions and pinned factor index
        run: |
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV13Optimized.cpp -lgmpxx -lgmp -o Build/ProofTreeV13
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV14.cpp -lgmpxx -lgmp -o Build/ProofTreeV14
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV15.cpp -lgmpxx -lgmp -o Build/ProofTreeV15
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
      - name: Download and verify fixed dataset
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Compare complete roots and time-capped high-exponent cases
        working-directory: Build
        run: |
          set +e
          for spec in "1000 17 30" "1000 31 35" "1500 17 75" "2201 17 30"; do
            read -r exponent root cap <<< "$spec"
            for version in ProofTreeV13 ProofTreeV14 ProofTreeV15; do
              echo "=== EARLY_LP version=$version exponent=$exponent root=$root cap=$cap ==="
              timeout --signal=TERM --kill-after=5s "${cap}s" "./$version" "$exponent" "$root" 2>&1 | tee "${version}_E${exponent}_P${root}.log"
              rc="${PIPESTATUS[0]}"
              if [[ "$rc" == 0 ]] && grep -Eq "^Forbid p=${root} -> PROVEN .*failed_rb=0" "${version}_E${exponent}_P${root}.log"; then
                status=PROVEN
              elif [[ "$rc" == 124 ]]; then
                status=TIMEOUT
              else
                status=UNRESOLVED
              fi
              echo "EARLY_LP_RESULT version=$version exponent=$exponent root=$root status=$status rc=$rc"
            done
          done
      - name: Retain source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ForcedPrimeLpBenchmarkResults
          path: |
            Build/PrefixDualBounds.csv
            Build/PrefixDualVariableGains.csv
            Build/PrefixDualForcedGains.csv
            Build/TargetedCertificateLog.txt
            Build/ProofTreeV*.log
          if-no-files-found: ignore
          retention-days: 30
