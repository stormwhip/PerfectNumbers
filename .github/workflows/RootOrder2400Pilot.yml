name: Target-2400 alternative root-order pilot
on:
  push:
    paths:
      - '.github/workflows/RootOrder2400Pilot.yml'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GMP/zlib and build deterministic engine
        run: |
          sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
          mkdir -p Build
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV21.cpp -lgmpxx -lgmp -o Build/ProofTreeV21
          g++ -std=c++17 -O2 Sources/Cpp/PrimeCutoffCert.cpp -lgmpxx -lgmp -o Build/PrimeCutoffCert
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
      - name: Reuse all 256 genuine enhanced prefix certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45004245214 --repo "$GITHUB_REPOSITORY" --name Full2400PrefixDualTables --dir Build
          test "$(($(wc -l < Build/PrefixDualBounds.csv) - 1))" -eq 256
          test -s Build/PrefixDualVariableGains.csv
          test -s Build/PrefixDualForcedGains.csv
          sha256sum Build/PrefixDualBounds.csv Build/PrefixDualVariableGains.csv Build/PrefixDualForcedGains.csv
      - name: Prepare exact cutoff and factor input
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./PrimeCutoffCert 100000000 > PrimeCutoffLog.txt
          echo '70ba114b47e7539480c418094606b0f39b2bc230337212426872d7f7adb400ec  PrimeCutoffProduct.bin' | sha256sum --check
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Compare root 19 at different prefix lengths with 30-second caps
        working-directory: Build
        run: |
          set +e
          errors=0
          for spec in 'first|19,7,11,31,13,3,5,17|19' 'after3|3,19,7,11,31,13,5,17|19' 'after357|3,5,7,19,11,31,13,17|19' 'last|3,5,7,11,13,17,31,19|19' '3first|3,5,7,11,13,17,31,19|3'; do
            IFS='|' read -r label order prime <<< "$spec"
            echo "=== ROOT_ORDER2400 label=$label order=$order root=$prime cap=30 ==="
            OPN_ROOT_ORDER="$order" timeout --signal=TERM --kill-after=5s 30s ./ProofTreeV21 2400 "$prime" 2>&1 | tee "Order_$label.log"
            rc="${PIPESTATUS[0]}"
            if [[ "$rc" == 0 ]] && grep -Eq "^Forbid p=$prime -> PROVEN .*failed_rb=0" "Order_$label.log"; then
              status=PROVEN
            elif [[ "$rc" == 124 ]]; then
              status=TIMEOUT
            elif [[ "$rc" == 3 ]] && grep -Eq "^Forbid p=$prime -> FAILED" "Order_$label.log"; then
              status=UNRESOLVED
            else
              status=ERROR
              errors=$((errors + 1))
            fi
            echo "ROOT_ORDER2400_RESULT label=$label prime=$prime status=$status rc=$rc"
          done
          if (( errors > 0 )); then echo "::error::$errors malformed profile(s)"; exit 1; fi
      - name: Archive source-backed root order profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RootOrder2400PilotResults
          path: |
            Build/Order_*.log
            Build/PrimeCutoffLog.txt
          retention-days: 30
          if-no-files-found: ignore
