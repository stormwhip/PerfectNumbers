name: Factor-chain proof experiments
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Compile only or execute proof experiment'
        required: true
        default: 'CompileOnly'
        type: choice
        options:
          - CompileOnly
          - Prove
      exponent:
        description: 'Target exponent k for 10^k'
        required: true
        default: '300'
        type: string
      version:
        description: 'Tree version to execute'
        required: true
        default: 'V6'
        type: choice
        options:
          - V5
          - V6
      prime:
        description: 'A root prime or all 15 roots'
        required: true
        default: '17'
        type: choice
        options:
          - all
          - '127'
          - '19'
          - '7'
          - '11'
          - '331'
          - '31'
          - '97'
          - '61'
          - '13'
          - '398581'
          - '1093'
          - '3'
          - '5'
          - '307'
          - '17'
permissions:
  contents: read
jobs:
  factor-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GMP and zlib
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Compile index builder and proof-tree versions
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
          for source in Sources/Cpp/ProofTreeV*.cpp; do
            g++ -std=c++17 -O2 -fopenmp "$source" -lgmpxx -lgmp -o "Build/$(basename "$source" .cpp)"
          done
      - name: Compile and run core regression checks
        run: |
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofCoreTests.cpp -lgmpxx -lgmp -o Build/ProofCoreTests
          ./Build/ProofCoreTests
      - name: Validate proof experiment parameters
        if: inputs.mode == 'Prove'
        env:
          EXPONENT: ${{ inputs.exponent }}
          ROOT_PRIME: ${{ inputs.prime }}
        run: |
          [[ "$EXPONENT" =~ ^[1-9][0-9]{0,9}$ ]] && (( EXPONENT <= 2147483647 )) || {
            echo "::error::Exponent must be a positive C++ int."
            exit 1
          }
          case "$ROOT_PRIME" in
            all|127|19|7|11|331|31|97|61|13|398581|1093|3|5|307|17) ;;
            *) echo "::error::Unknown root prime."; exit 1 ;;
          esac
      - name: Download and verify factorization snapshot
        if: inputs.mode == 'Prove'
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 600 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          mv checkfacts.txt.gz CheckFacts.txt.gz
      - name: Build factorization index
        if: inputs.mode == 'Prove'
        working-directory: Build
        run: |
          ./BuildIndex CheckFacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Run V5 tree and check all selected root results
        if: inputs.mode == 'Prove'
        working-directory: Build
        env:
          EXPONENT: ${{ inputs.exponent }}
          ROOT_PRIME: ${{ inputs.prime }}
          PROOF_VERSION: ${{ inputs.version }}
        run: |
          export OMP_NUM_THREADS="$(nproc)"
          if [[ "$ROOT_PRIME" == all ]]; then
            set -o pipefail
            ./ProofTree"$PROOF_VERSION" "$EXPONENT" | tee Proof.log
            expected_primes=(127 19 7 11 331 31 97 61 13 398581 1093 3 5 307 17)
          else
            set -o pipefail
            ./ProofTree"$PROOF_VERSION" "$EXPONENT" "$ROOT_PRIME" | tee Proof.log
            expected_primes=("$ROOT_PRIME")
          fi
          for prime in "${expected_primes[@]}"; do
            grep -Eq "^Forbid p=$prime -> PROVEN .* failed_rb=0 \\|" Proof.log || {
              echo "::error::Root $prime failed or remained unresolved."
              exit 1
            }
          done
