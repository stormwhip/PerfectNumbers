name: Profile V21 2400 hard-shard CPU costs
on:
  push:
    branches:
      - research/exact-sigma-size-v22
    paths:
      - '.github/workflows/ProofTreeV21Profiler.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Build V21 profiler and data helpers
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV21Profile.cpp -lgmpxx -lgmp -o Build/ProofTreeV21Profile
          g++ -std=c++17 -O2 Sources/Cpp/PrimeCutoffCert.cpp -lgmpxx -lgmp -o Build/PrimeCutoffCert
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
      - name: Use pinned 256-prefix certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45004245214 --repo "$GITHUB_REPOSITORY" --name Full2400PrefixDualTables --dir Build
          echo '50fb6f90dfe76c5e40c73eb0d4c4136b10fd487eb68f4207e7399892728700b3  Build/PrefixDualBounds.csv' | sha256sum --check
          echo '6504908211c6a54520a8091f54c1abe8eb2c52f753a10a784f47b446ed4a5fcb  Build/PrefixDualVariableGains.csv' | sha256sum --check
          echo '0e119ce7f7aa8bcf4e6890b828bd674d7462fb166e4adf2e3d9adf5d1040d6f2  Build/PrefixDualForcedGains.csv' | sha256sum --check
      - name: Build pinned exact cutoff and factor index
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./PrimeCutoffCert 100000000 > PrimeCutoffBuild.log
          echo '70ba114b47e7539480c418094606b0f39b2bc230337212426872d7f7adb400ec  PrimeCutoffProduct.bin' | sha256sum --check
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Profile two difficult exponent-19 shards, 12s each
        working-directory: Build
        run: |
          set -euo pipefail
          ./ProofTreeV21Profile 2400 19 list > ProfileShards.txt
          grep -q 'SHARD_COUNT root=19 count=287' ProfileShards.txt
          for index in 0 100; do
            set +e
            timeout --signal=TERM --kill-after=1s 12s ./ProofTreeV21Profile 2400 19 "$index" > "Profile_$index.log" 2>&1
            rc=$?
            set -e
            echo "PROFILE_SHARD index=$index rc=$rc"
            grep '^\[PROFILE\]' "Profile_$index.log" | tail -n 1 || true
            grep '^\[PROGRESS\]' "Profile_$index.log" | tail -n 1 || true
          done
      - name: Upload profiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProofTreeV21HardShardProfiles
          path: |
            Build/ProfileShards.txt
            Build/Profile_*.log
          retention-days: 30
          if-no-files-found: ignore
