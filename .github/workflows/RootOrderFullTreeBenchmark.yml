name: Canonical versus DP-optimized root order
on:
  push:
    paths:
      - '.github/workflows/RootOrderFullTreeBenchmark.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Compile variants and index pinned database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV11.cpp -lgmpxx -lgmp -o Build/ProofTreeCanonical
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV11Optimized.cpp -lgmpxx -lgmp -o Build/ProofTreeOptimized
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
          cd Build
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Compare full root sequences
        working-directory: Build
        run: |
          set +e
          for exponent in 300 500; do
            for variant in ProofTreeCanonical ProofTreeOptimized; do
              echo "=== FULL_TREE variant=$variant exponent=$exponent ==="
              timeout --signal=TERM --kill-after=5s 90s "./$variant" "$exponent" 2>&1 | tee "${variant}_${exponent}.log"
              rc="${PIPESTATUS[0]}"
              echo "FULL_TREE_RESULT variant=$variant exponent=$exponent exit=$rc"
            done
          done
      - name: Archive complete tree logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RootOrderFullTreeComparison
          path: Build/ProofTree*.log
          if-no-files-found: ignore
          retention-days: 30
