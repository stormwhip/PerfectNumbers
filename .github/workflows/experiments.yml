name: Python experiments

on:
  push:
    paths:
      - '复现程序/**'
      - 'requirements.txt'
      - '.github/workflows/experiments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run LP baseline
        run: python '复现程序/baseline.py'
      - name: Run ablation and roadblock experiments
        run: python '复现程序/test.py'
      - name: Run interval dual certificate
        run: python '复现程序/ScriptA.py'
