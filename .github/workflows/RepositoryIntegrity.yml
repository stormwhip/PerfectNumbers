name: Repository integrity and independent proof smoke checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'Documentation/**'
      - 'Records/**'
      - 'Readme.md'
      - 'Research/FermatRootValuation/**'
      - 'Research/Session20261122/Certificates/**'
      - 'Research/Session20261122/Python/**'
      - 'Research/SupplierBatch/**'
      - 'Sources/Python/RepositoryStructureChecks.py'
      - '.github/workflows/RepositoryIntegrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify PascalCase paths and Markdown links
        run: python3 Sources/Python/RepositoryStructureChecks.py
      - name: Install C++ prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev g++
      - name: Run independent Python verifier and ledger regressions
        run: |
          set -e
          for name in VerifierV2Tests VerifierV2AuditTests FrontierV2FaultTests AuditRunnerTests AuditRunnerAuditTests FrontierV2MixedEdgeTests PrimeCutoffGCDTests DirectRootClosuresTests FiniteQuotientClosureTests CyclotomicPrimorialClosureTests CyclotomicExponentDPClosureTests RootOrderDirectClosureDP; do
            python3 -S -O "Research/Session20261122/Python/${name}.py"
          done
          python3 Research/Session20261122/Python/ForcedPrimeExponentClosure2400.py --verify --root 3 --exponent 2476 --forced-prime 980893
      - name: Replay and compare the complete 2400 audit
        run: |
          python3 Research/FermatRootValuation/IndependentCheck.py
          mkdir -p Build
          python3 Research/SupplierBatch/VerifyBatch2400.py --output Build/AuditSummary2400.json
          cmp Research/SupplierBatch/BatchAudit2400.json Build/AuditSummary2400.json
      - name: Upload the exact audit and remaining shard manifest
        uses: actions/upload-artifact@v4
        with:
          name: AuditSummary2400
          path: Build/AuditSummary2400.json
      - name: Build C++ codec and single-flight regressions
        run: |
          set -e
          g++ -std=c++17 -O2 -pthread Sources/Cpp/V21FrontierCodecTests.cpp -lgmpxx -lgmp -o /tmp/OpnCodecTests
          /tmp/OpnCodecTests
          g++ -std=c++17 -O2 -pthread Sources/Cpp/SingleFlightFactCacheTests.cpp -o /tmp/OpnSingleFlightTests
          /tmp/OpnSingleFlightTests
          g++ -std=c++17 -O2 Sources/Cpp/SigmaPrecheckTests.cpp -lgmpxx -lgmp -o /tmp/OpnSigmaPrecheckTests
          /tmp/OpnSigmaPrecheckTests
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV21Frontier.cpp -lgmpxx -lgmp -o /tmp/OpnFrontier
