name: Certified cutoff target 2400 matched benchmark
on:
  push:
    paths:
      - '.github/workflows/CertifiedCutoff2400Benchmark.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Requirements.txt
      - name: Install libraries
        run: |
          python -m pip install -r Requirements.txt
          sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Compile V18 and V19, regression and exact sieve
        run: |
          mkdir -p Build
          for name in ProofTreeV18 ProofTreeV19 ProofCoreTestsV19; do
            g++ -std=c++17 -O2 -fopenmp "Sources/Cpp/$name.cpp" -lgmpxx -lgmp -o "Build/$name"
          done
          ./Build/ProofCoreTestsV19
          g++ -std=c++17 -O2 Sources/Cpp/PrimeCutoffCert.cpp -lgmpxx -lgmp -o Build/PrimeCutoffCert
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
      - name: Build and hash-check complete 1e8 primorial
        working-directory: Build
        run: |
          set -o pipefail
          ./PrimeCutoffCert 100000000 | tee CutoffLog.txt
          echo '70ba114b47e7539480c418094606b0f39b2bc230337212426872d7f7adb400ec  PrimeCutoffProduct.bin' | sha256sum --check
      - name: Generate 9 enhanced LP prefix certificates
        run: |
          set -o pipefail
          python -u Sources/Python/Targeted2400Certificates.py Build/PrefixDualBounds.csv | tee Build/PrefixLpLog.txt
      - name: Download and index pinned factor table
        working-directory: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download data-v1 --repo "$GITHUB_REPOSITORY" --pattern checkfacts.txt.gz; then
            curl --fail --location --retry 2 --max-time 300 \
              --output checkfacts.txt.gz 'https://www.lirmm.fr/~ochem/opn/checkfacts.txt.gz'
          fi
          echo 'ff1e84b119949ffcce57b29616d57ed5d03793ad3e4f74f1b203ad0e809f4119  checkfacts.txt.gz' | sha256sum --check
          ./BuildIndex checkfacts.txt.gz
          test "$(stat -c %s facts.dat)" = 745826778
          test "$(stat -c %s facts.idx)" = 1322332128
      - name: Compare hard roots with 30-second caps
        working-directory: Build
        run: |
          set +e
          errors=0
          for root in 19 31 17; do
            for version in V18 V19; do
              echo "=== CUTOFF2400 version=$version root=$root cap=30 ==="
              timeout --signal=TERM --kill-after=5s 30s "./ProofTree$version" 2400 "$root" 2>&1 | tee "CUTOFF_${root}_${version}.log"
              rc="${PIPESTATUS[0]}"
              if [[ "$rc" == 0 ]] && grep -Eq "^Forbid p=$root -> PROVEN .*failed_rb=0" "CUTOFF_${root}_${version}.log"; then
                status=PROVEN
              elif [[ "$rc" == 124 ]]; then
                status=TIMEOUT
              else
                status=UNRESOLVED
                errors=$((errors + 1))
              fi
              echo "CUTOFF2400_RESULT version=$version root=$root status=$status rc=$rc"
            done
          done
          if (( errors > 0 )); then echo "::error::$errors solver errors"; exit 1; fi
      - name: Archive diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CertifiedCutoff2400BenchmarkResults
          path: |
            Build/CutoffLog.txt
            Build/PrefixLpLog.txt
            Build/CUTOFF_*.log
          retention-days: 30
          if-no-files-found: ignore
