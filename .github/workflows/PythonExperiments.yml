name: Python LP experiments
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Python experiment to run'
        required: true
        default: 'Baseline'
        type: choice
        options:
          - Baseline
          - Ablation
          - IntervalCertificate
permissions:
  contents: read
jobs:
  python-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r Requirements.txt
      - name: Run selected experiment
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: python "Sources/Python/${EXPERIMENT}.py"
