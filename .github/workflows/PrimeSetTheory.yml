name: Prime-set theorem screening
on:
  push:
    paths:
      - '.github/workflows/PrimeSetTheory.yml'
      - 'Sources/Python/PrimeSetSearch.py'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Requirements.txt
      - name: Install scientific dependencies
        run: python -m pip install -r Requirements.txt
      - name: Select smaller forbidden sets and certify complement bounds
        run: |
          set -o pipefail
          python -u Sources/Python/PrimeSetSearch.py | tee PrimeSetResults.log
      - name: Archive screening output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrimeSetTheoryResults
          path: PrimeSetResults.log
          if-no-files-found: ignore
          retention-days: 30
