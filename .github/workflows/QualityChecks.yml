name: Source quality checks (2400)
on:
  push:
    paths:
      - 'Sources/**'
      - 'Requirements.txt'
      - '.github/workflows/QualityChecks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Build and test the current C++ proof tree
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV21.cpp -lgmpxx -lgmp -o Build/ProofTreeV21
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofCoreTestsV21.cpp -lgmpxx -lgmp -o Build/ProofCoreTestsV21
          ./Build/ProofCoreTestsV21
      - name: Check restartable 72-hour scheduler on synthetic root partitions
        run: python3 Sources/Python/Run2400SchedulerTests.py
      - name: Validate WSL reproducibility wrapper syntax
        run: bash -n Scripts/Run72hWSL.sh
      - name: Run pure Python tests and syntax validation
        run: |
          python3 Sources/Python/CertificateTests.py
          python3 -m compileall -q Sources/Python
