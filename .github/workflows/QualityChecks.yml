name: Source quality checks (2400)
on:
  push:
    paths:
      - 'Sources/**'
      - 'Requirements.txt'
      - '.github/workflows/QualityChecks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zlib1g-dev
      - name: Build current C++ indexer and proof tree
        run: |
          mkdir -p Build
          g++ -std=c++17 -O2 Sources/Cpp/BuildIndex.cpp -lz -o Build/BuildIndex
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV16.cpp -lgmpxx -lgmp -o Build/ProofTreeV16
      - name: Run C++ interval LP regression tests
        run: |
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofCoreTestsV16.cpp -lgmpxx -lgmp -o Build/ProofCoreTestsV16
          ./Build/ProofCoreTestsV16
      - name: Verify V18 safe residual counts
        run: |
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV18.cpp -lgmpxx -lgmp -o Build/ProofTreeV18
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofCoreTestsV18.cpp -lgmpxx -lgmp -o Build/ProofCoreTestsV18
          ./Build/ProofCoreTestsV18
      - name: Verify V19 exact prime-cutoff classification on a synthetic case
        run: |
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofTreeV19.cpp -lgmpxx -lgmp -o Build/ProofTreeV19
          g++ -std=c++17 -O2 -fopenmp Sources/Cpp/ProofCoreTestsV19.cpp -lgmpxx -lgmp -o Build/ProofCoreTestsV19
          ./Build/ProofCoreTestsV19
      - name: Verify V20 shard manifest and V21 lazy residual core logic
        run: |
          for version in 20 21; do
            g++ -std=c++17 -O2 -fopenmp "Sources/Cpp/ProofTreeV${version}.cpp" -lgmpxx -lgmp -o "Build/ProofTreeV${version}"
            g++ -std=c++17 -O2 -fopenmp "Sources/Cpp/ProofCoreTestsV${version}.cpp" -lgmpxx -lgmp -o "Build/ProofCoreTestsV${version}"
            "./Build/ProofCoreTestsV${version}"
          done
      - name: Check restartable 72-hour scheduler on synthetic root partitions
        run: python3 Sources/Python/Run2400SchedulerTests.py
      - name: Run pure Python tests and syntax validation
        run: |
          python3 Sources/Python/CertificateTests.py
          python3 -m compileall -q Sources/Python
